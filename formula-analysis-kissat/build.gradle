import org.ysb33r.gradle.gnumake.GnuMakeBuild


plugins {
    id 'java-library'
    id 'de.featjar.java-application'
    // plugin for Gradle that allows invoking GNU Make builds
    id 'org.ysb33r.gnumake' version '2.1.1'
}

dependencies {
    api 'de.featjar:formula'
    testImplementation testFixtures('de.featjar:formula')
}

license {
    ext {
        licence_url = 'https://github.com/FeatureIDE/FeatJAR-formula-analysis-kissat'
    }
}


//disable copyBinaries if the kissat binary is built locally
copyBinaries.enabled = false

// compile kissat locally by cloning the repo, executing the configure script and 
// executing make
tasks.register('clone', Exec) {
   commandLine 'git', 'clone', 'https://github.com/arminbiere/kissat.git'
}

tasks.register('configure', Exec) {
   dependsOn tasks.clone
   workingDir "kissat"
   commandLine './configure', 'CC=clang'
}

tasks.named('make', GnuMakeBuild) {
    dependsOn tasks.configure
    workingDir = "kissat"
}

// prioritize own compilation of kissat when copying kissat binaries to 
// /.featjar-bin in the user home directory
tasks.register('copyKissat', Copy) {
    dependsOn tasks.make

    from 'kissat/build/kissat'
    from 'src/main/resources/bin/.'

    into System.getProperty('user.home') + '/.featjar-bin'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filePermissions {
    user {
        write = true
        read = true
        execute = true
    }
    other.execute = false
    }
}

// ensure that copyKissat is executed before the common tasks
configure([assemble, test, build, clean, javadoc, licenseFormatMain, licenseFormatTest, spotlessApply, publishToMavenLocal, release]) {
    dependsOn copyKissat
}



