import org.ysb33r.gradle.gnumake.GnuMakeBuild

plugins {
    id 'java-library'
    id 'de.featjar.java-application'
    id 'org.ysb33r.gnumake' version '2.1.1'
}

dependencies {
    api 'de.featjar:formula'
    testImplementation testFixtures('de.featjar:formula')
}

license {
    ext {
        licence_url = 'https://github.com/FeatureIDE/FeatJAR-formula-analysis-cadical'
    }
}

tasks.register('cloneCadical', Exec) {
   commandLine 'git', 'clone', 'https://github.com/arminbiere/cadical.git'
}

tasks.register('cloneCadiback', Exec) {
   commandLine 'git', 'clone', 'https://github.com/arminbiere/cadiback.git'
}


tasks.register('configureCadical', Exec) {
   dependsOn tasks.cloneCadical
   workingDir "cadical"
   commandLine './configure', 'CXX=clang++'
}

// here the build works using CXX=clang++
task makeCadical (type:GnuMakeBuild) {
    dependsOn tasks.configureCadical
    workingDir = "cadical"
}

tasks.register('configureCadiback', Exec) {
   dependsOn tasks.cloneCadiback
   dependsOn tasks.makeCadical
   workingDir "cadiback"
   commandLine './configure'
}

// does not work yet, throws same error as before:
// g++: fatal error: cannot execute 'cc1plus': 
// posix_spawnp: No such file or directory.
// compilation terminated.
// here. I used: ./gradlew formula-analysis-cadical:makeCadiback
task makeCadiback (type:GnuMakeBuild) {
    dependsOn tasks.configureCadiback
    workingDir = "cadiback"
}

